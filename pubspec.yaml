name: mindikot_flutter
description: Offline LAN Multiplayer MindiKot Card Game built with Flutter.

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  flutter_riverpod: ^2.6.1

  equatable: ^2.0.7

  collection: ^1.19.1

  uuid: ^4.5.1

  shared_preferences: ^2.5.3

  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

  build_runner: ^2.5.4

  json_serializable: ^6.9.5

flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/sounds/

  fonts: []